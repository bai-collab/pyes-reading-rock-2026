<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>兩校閱讀方案｜放射知識結構圖</title>
<link rel="stylesheet" href="./style.css">
<style>.home-link{font-weight:bold;text-decoration:none;letter-spacing:0}</style>
</head><body>
<figure class="stage" id="stage" aria-label="可平移縮放的放射知識圖"><div id="board"><svg id="wires" width="1" height="1" aria-label="實線章節階層與虛線主題關聯"></svg><div id="nodes"></div></div><figcaption class="sr-only">核心向外展開原文章節與內容卡。實線表示包含，虛線表示兩節共有整理者主題，不代表因果。</figcaption></figure>
<header class="panel topbar" id="topbar"><div class="brand"><p class="eyebrow"><a class="home-link" href="../index.html">← 回課程導航</a>　民和 × 龍山 · 閱讀方案</p><h1>閱讀方案知識結構圖</h1><p id="status">核心 → 原文章群 → 重點與範例卡</p></div><nav class="tools" aria-label="知識圖控制">
<label class="sr-only" for="document">資料</label><select id="document"><option value="minhe">民和國小</option><option value="longshan">龍山國小</option></select>
<div class="search-wrap"><label class="sr-only" for="search">搜尋</label><input id="search" type="search" placeholder="搜尋章節、重點、範例"><div id="search-results" class="search-results" hidden aria-live="polite"></div></div>
<label class="sr-only" for="theme">主題關聯</label><select id="theme"><option value="auto">全部主題關連</option><option value="">關閉虛線</option></select>
<button id="zoom-out" aria-label="縮小">−</button><button id="zoom-in" aria-label="放大">＋</button><button id="fit">全圖</button><button id="reset" disabled>取消聚焦</button><button id="theme-toggle" aria-label="切換深淺色">深色</button><button id="compare">兩校比較</button><button id="download" aria-label="匯出圖譜資料">匯出</button>
</nav></header>
<aside class="panel legend" id="legend" aria-label="章節圖例"><div class="panel-head"><h2>章節圖例</h2><button id="legend-toggle" aria-label="收合章節圖例" aria-expanded="true">−</button></div><div id="legend-content"><div id="chapter-list"></div><p class="note">實線＝原文階層；虛線弧線＝兩節共有整理者主題（可跨章）。點節卡會亮起相關節與連線，內容面板可放大原文頁截圖。</p><div class="line-key"><span><i class="solid"></i>核心 → 章 → 節／子節</span><span><i class="dashed"></i>同主題相關節（非因果）</span><span><i class="related-key"></i>被點選節的相關節</span></div><p id="counts" class="note"></p><p class="note">依指定<a href="https://bai-collab.github.io/pyes-reading-rock-2026/pbl-map.html" target="_blank" rel="noopener noreferrer">放射圖範例</a>重繪</p></div></aside>
<aside class="panel detail" id="detail" aria-label="節點完整內容"><div class="panel-head"><h2 id="detail-label">內容與範例</h2><button id="detail-toggle" aria-label="收合內容面板" aria-expanded="true">−</button></div><div id="detail-body"></div></aside>
<div class="panel hint" id="hint">拖曳空白 <b>移動畫布</b>　拖曳卡片 <b>重新排版</b>　滾輪 <b>縮放</b>　點章節 <b>聚焦</b> <span id="zoom-value">100%</span></div>
<dialog id="viewer" class="viewer" aria-labelledby="viewer-title"><div class="viewer-head"><h2 id="viewer-title">原文頁面</h2><span id="viewer-count"></span><button id="viewer-close" type="button" aria-label="關閉原文頁面">×</button></div><div class="viewer-body"><img id="viewer-img" alt=""><p id="viewer-error" hidden>這張截圖無法載入；請改用下方按鈕開啟原檔。</p></div><div class="viewer-foot"><button id="viewer-prev" type="button">← 上一頁</button><button id="viewer-next" type="button">下一頁 →</button><a id="viewer-pdf" target="_blank" rel="noopener noreferrer">開啟 PDF</a><a id="viewer-drive" target="_blank" rel="noopener noreferrer">Google Drive 原檔</a><span class="viewer-tip">點圖放大／縮回；←→ 翻頁；Esc 關閉</span></div></dialog>
