<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="北園國小六年閱讀 PBL 可展開式知識地圖：以五條縱貫主軸連結一年級至六年級的文本、閱讀、寫作與 PBL。" />
  <title>北園國小｜六年閱讀 PBL 知識地圖</title>
  <link rel="stylesheet" href="pbl-pathways.css" />
</head>
<body>
  <main class="map-shell">
    <div class="map-toolbar" aria-label="知識地圖工具列">
      <a class="map-home" href="index.html">← 課程導航</a>
      <div class="map-title">
        <strong>北園六年閱讀 PBL 知識地圖</strong>
        <span>點主軸展開六年縱貫；點年級展開文本、讀法、寫作與 PBL</span>
      </div>
      <div class="map-actions">
        <button id="zoomOut" type="button" aria-label="縮小">−</button>
        <button id="zoomIn" type="button" aria-label="放大">＋</button>
        <button id="fitMap" type="button">回到中心</button>
        <button id="collapseMap" type="button">全部收合</button>
      </div>
    </div>

    <div id="mapCanvas" class="map-canvas" aria-label="可拖曳與縮放的六年閱讀 PBL 知識地圖">
      <svg id="mindmapSvg" role="img" aria-label="北園國小六年閱讀 PBL 知識地圖">
        <g id="mapViewport"></g>
      </svg>
    </div>

    <div class="map-help">
      <span><b>拖曳</b> 移動畫布</span>
      <span><b>滾輪</b> 縮放</span>
      <span><b>點節點</b> 展開／收合</span>
      <span class="dash-key"><i></i> 跨年級主題連線</span>
    </div>

    <aside id="mapStatus" class="map-status" aria-live="polite">
      <strong>從中心開始</strong>
      <p>先選一條六年縱貫主軸，看看同一個能力或問題如何從一年級一路長到六年級。</p>
    </aside>
  </main>

  <script src="pbl-pathways.js"></script>
</body>
</html>
