<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="北園國小六年閱讀 PBL 全展開式知識地圖：以年級為主，向外展開核心書名、任務與學習單。" />
  <title>北園國小｜六年閱讀 PBL 路網知識地圖</title>
  <link rel="stylesheet" href="pbl-pathways.css" />
</head>
<body>
  <main class="map-shell">
    <header class="map-toolbar" aria-label="知識地圖工具列">
      <a class="map-home" href="index.html">← 回課程導航</a>
      <div class="map-title">
        <strong>北園六年閱讀 PBL 路網知識地圖</strong>
        <span>以年級為主，向外展開書名、任務與學習單；移到任一路線，會亮出該路線與相關路線。</span>
      </div>
      <div class="map-actions">
        <button id="zoomOut" type="button" aria-label="縮小">−</button>
        <button id="zoomIn" type="button" aria-label="放大">＋</button>
        <button id="fitMap" type="button">回到中心</button>
        <button id="resetFocus" type="button" disabled>取消聚焦</button>
      </div>
    </header>

    <div id="mapCanvas" class="map-canvas" aria-label="可拖曳與縮放的六年閱讀 PBL 知識地圖">
      <svg id="mindmapSvg" role="img" aria-label="北園六年閱讀 PBL 路網知識地圖">
        <g id="mapViewport"></g>
      </svg>
    </div>

    <div class="map-help">
      <span><b>拖曳</b> 移動畫布</span>
      <span><b>滾輪</b> 縮放</span>
      <span><b>滑過路線</b> 暫時聚焦</span>
      <span><b>點年級</b> 鎖定聚焦</span>
      <span class="dash-key"><i></i> 跨年級關聯線</span>
    </div>

    <aside id="mapStatus" class="map-status" aria-live="polite">
      <strong>閱讀方式</strong>
      <p>這是一張全展開路網圖。先看中心，再沿著六個年級往外讀到書名、任務與學習單；滑過任一路線時，其他不相關路線會淡化；點年級可把該年級與跨年級關聯固定亮起。</p>
    </aside>
  </main>

  <script src="pbl-pathways.js"></script>
</body>
</html>
